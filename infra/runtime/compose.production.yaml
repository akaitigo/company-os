name: company-os-production

x-runtime-policy: &runtime-policy
  user: '10001:10001'
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  restart: unless-stopped
  stop_grace_period: 10s
  networks: [company-os]

services:
  api:
    <<: *runtime-policy
    image: ${API_IMAGE:?API_IMAGE must be an immutable digest}
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER is required}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?OIDC_AUDIENCE is required}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?OTEL_EXPORTER_OTLP_ENDPOINT is required}
    secrets:
      - database_url
      - source: database_ca
        target: database_ca.crt
    mem_limit: 512m
    cpus: 1

  worker:
    <<: *runtime-policy
    image: ${WORKER_IMAGE:?WORKER_IMAGE must be an immutable digest}
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?OTEL_EXPORTER_OTLP_ENDPOINT is required}
    secrets:
      - database_url
      - source: database_ca
        target: database_ca.crt
    mem_limit: 256m
    cpus: 0.5

  web:
    <<: *runtime-policy
    image: ${WEB_IMAGE:?WEB_IMAGE must be an immutable digest}
    environment:
      SESSION_SECRET_FILE: /run/secrets/session_secret
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER is required}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?OIDC_CLIENT_ID is required}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?OIDC_REDIRECT_URI is required}
      API_INTERNAL_URL: http://api:3001
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?OTEL_EXPORTER_OTLP_ENDPOINT is required}
    secrets: [session_secret]
    ports:
      - ${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000
    mem_limit: 256m
    cpus: 0.5

networks:
  company-os: {}

secrets:
  database_url:
    file: ${DATABASE_URL_SECRET_FILE:?DATABASE_URL_SECRET_FILE is required}
  database_ca:
    file: ${DATABASE_CA_CERT_FILE:?DATABASE_CA_CERT_FILE is required}
  session_secret:
    file: ${SESSION_SECRET_SECRET_FILE:?SESSION_SECRET_SECRET_FILE is required}
