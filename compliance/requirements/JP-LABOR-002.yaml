jurisdiction: JP
requirement_type: legal_obligation
status: verified
authority: 厚生労働省
sources:
  - source_type: official_faq
    title: 賃金台帳等の労働契約関係の書類の保存期間は何年ですか
    legal_reference: 労働基準法第109条、第143条第1項・第3項
