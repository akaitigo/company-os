name: company-os
services:
  postgres:
    image: company-os-postgres:18.4-gosu-go1.24.13
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile.gosu
    environment:
      POSTGRES_DB: company_os
      POSTGRES_USER: company_os
      POSTGRES_PASSWORD: local-development-only
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U company_os -d company_os']
      interval: 5s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    command: ['start-dev', '--health-enabled=true', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-development-only
    ports: ['127.0.0.1:8080:8080']
    volumes:
      - ./infra/keycloak/company-os-realm.json:/opt/keycloak/data/import/company-os-realm.json:ro
  otel-collector:
    image: otel/opentelemetry-collector:0.162.0@sha256:310a800ad69ee430e7c541796852a242c9c7db97aaad4daa5ccf843c525fbdb2
    command: ['--config=/etc/otelcol/config.yaml']
    volumes: ['./infra/otel/config.yaml:/etc/otelcol/config.yaml:ro']
    ports: ['127.0.0.1:4317:4317', '127.0.0.1:4318:4318']
volumes:
  postgres-data:
